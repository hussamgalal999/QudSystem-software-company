name: Deploy Qudron Cloudflare pilot
on:
  workflow_dispatch:
  push:
    branches: [feature/qudron-cvpen-swarm-release-candidate]
    paths: ["ops/qudron-cloudflare/**", ".github/workflows/qudron-cloudflare-deploy.yml"]
permissions:
  contents: read
concurrency:
  group: qudron-cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/qudron-cloudflare
    steps:
      - name: Check deployment credentials are configured
        id: credentials
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; deployment safely skipped."
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: 22
      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm install --no-audit --no-fund
      - name: Verify before deployment
        if: steps.credentials.outputs.available == 'true'
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Deploy to Cloudflare
        if: steps.credentials.outputs.available == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
