name: Deploy Qudron Cloudflare pilot
on:
  workflow_dispatch:
  push:
    branches: [feature/qudron-cvpen-swarm-release-candidate]
    paths: ["ops/qudron-cloudflare/**", ".github/workflows/qudron-cloudflare-deploy.yml"]
permissions:
  contents: read
concurrency:
  group: qudron-cloudflare-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, verify and deploy (skip safely without credentials)
        working-directory: ops/qudron-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured; deployment safely skipped."
            exit 0
          fi
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npx wrangler deploy
