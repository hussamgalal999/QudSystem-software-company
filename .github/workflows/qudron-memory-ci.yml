name: Qudron Cloud Memory CI
on:
  push:
    branches: [main]
    paths: ["ops/qudron-memory/**", ".github/workflows/qudron-memory-ci.yml", ".github/workflows/qudron-memory-deploy.yml"]
  pull_request:
    paths: ["ops/qudron-memory/**", ".github/workflows/qudron-memory-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qudron-memory-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops/qudron-memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Test Worker request boundary behavior
        run: npm test
      - name: Validate Worker bundle
        run: npm run build
      - name: Validate D1 deployment ID wiring
        run: |
          grep -Fq 'database_id = "00000000-0000-0000-0000-000000000000"' wrangler.toml
          grep -Fq 'placeholder="00000000-0000-0000-0000-000000000000"' ../../.github/workflows/qudron-memory-deploy.yml
          grep -Fq 'sed -i "s/$placeholder/$QUDRON_MEMORY_D1_DATABASE_ID/"' ../../.github/workflows/qudron-memory-deploy.yml
