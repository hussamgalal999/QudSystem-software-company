name = "qudron-memory"
main = "src/index.ts"
compatibility_date = "2026-11-05"

[[d1_databases]]
binding = "DB"
database_name = "qudron-memory"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
MEMORY_SCHEMA_VERSION = "1"
MAX_BODY_BYTES = "65536"
