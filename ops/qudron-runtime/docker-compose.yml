services:
  qudron:
    build: .
    container_name: qudron-runtime
    restart: unless-stopped
    env_file: [.env]
    ports: ["8765:8765"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
