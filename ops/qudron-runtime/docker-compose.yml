services:
  qudron:
    build: .
    container_name: qudron-runtime
    restart: unless-stopped
    env_file: [.env]
    environment:
      # The internal FreeLLM sidecar is optional. This key is only used if
      # LLM_FAST_BASE_URL is explicitly set to http://freellm:4000/v1.
      LLM_FAST_API_KEY: ${FREELM_SERVER_KEY:-}
    ports: ["127.0.0.1:8765:8765"]
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional free-tier model router. No host port is published: only services
  # on this Compose network can reach it. It is not enabled unless --profile
  # free-ai is selected.
  freellm:
    profiles: ["free-ai"]
    build:
      context: .
      dockerfile: Dockerfile.freellm
    container_name: qudron-freellm
    restart: unless-stopped
    env_file: [.env]
    environment:
      FREELM_KEYLESS: ${FREELM_KEYLESS:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      KILO_API_KEY: ${KILO_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      FREELM_SERVER_KEY: ${FREELM_SERVER_KEY:-}
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
